<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Volume Beton</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>Kalkulator Volume Beton</h1>
    <p class="subtitle">Estimasi kebutuhan beton untuk beberapa bentuk elemen.</p>

    <form id="form-hitung" novalidate>

      <div class="field">
        <label for="bentuk">Bentuk elemen</label>
        <select id="bentuk"></select>
        <p class="rumus" id="rumus"></p>
      </div>

      <!-- Kolom ukuran dibuat otomatis oleh JavaScript sesuai bentuk -->
      <div id="area-ukuran"></div>

      <div class="grid-2">
        <div class="field">
          <label for="jumlah">Jumlah elemen</label>
          <input type="number" id="jumlah" inputmode="numeric" step="1" min="1" value="1">
          <p class="error" id="jumlah-error"></p>
        </div>
        <div class="field">
          <label for="susut">Susut/cadangan <span class="hint">(%)</span></label>
          <input type="number" id="susut" inputmode="decimal" step="any" min="0" value="5">
          <p class="error" id="susut-error"></p>
        </div>
      </div>

      <div class="field">
        <label for="kapasitas">Kapasitas truk mixer <span class="hint">(m³)</span></label>
        <input type="number" id="kapasitas" inputmode="decimal" step="any" min="0" value="7">
        <p class="error" id="kapasitas-error"></p>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">Hitung</button>
        <button type="reset" class="btn-secondary">Reset</button>
      </div>
    </form>

    <section id="hasil" aria-live="polite" hidden>
      <div class="hasil-baris">
        <span>Volume per elemen</span>
        <span><span id="hasil-per-elemen"></span> m³</span>
      </div>
      <div class="hasil-baris">
        <span>Volume total</span>
        <span><span id="hasil-total"></span> m³</span>
      </div>
      <div class="hasil-baris hasil-utama">
        <span>Dengan susut</span>
        <span><span id="hasil-susut"></span> m³</span>
      </div>
      <div class="hasil-baris hasil-truk">
        <span>Perkiraan truk mixer</span>
        <span><span id="hasil-truk"></span> truk</span>
      </div>
      <p class="hasil-detail" id="hasil-truk-detail"></p>

      <div class="hasil-aksi">
        <button type="button" id="tombol-salin" class="btn-kecil">Salin hasil</button>
        <span id="status-salin" class="status-salin" role="status"></span>
      </div>
    </section>

    <section class="riwayat" aria-labelledby="judul-riwayat">
      <div class="riwayat-kepala">
        <h2 id="judul-riwayat">Riwayat hitungan</h2>
        <button type="button" id="hapus-semua" class="btn-teks" hidden>Hapus semua</button>
      </div>
      <p id="riwayat-kosong" class="riwayat-kosong">Belum ada hitungan tersimpan.</p>
      <ul id="daftar-riwayat" class="daftar-riwayat"></ul>
    </section>

    <p class="catatan">
      Hasil ini hanya estimasi awal dan bukan pengganti perhitungan teknis oleh ahli.
    </p>
  </main>

  <!-- Urutan penting: file yang dipakai file lain dimuat lebih dulu -->
  <script src="js/data.js"></script>
  <script src="js/hitung.js"></script>
  <script src="js/input.js"></script>
  <script src="js/riwayat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
